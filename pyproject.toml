[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "public-api-docs-mcp"
version = "0.2.0"
description = "Read published Hoppscotch and Postman API documentation through MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]
keywords = ["hoppscotch", "postman", "mcp", "api-documentation"]

[project.urls]
Repository = "https://github.com/KidiXDev/public-api-docs-mcp"
Issues = "https://github.com/KidiXDev/public-api-docs-mcp/issues"

[project.scripts]
public-api-docs-mcp = "public_api_docs_mcp.server:main"

[tool.setuptools.packages.find]
include = ["public_api_docs_mcp*"]
